<!--
KURA-WEB — camada de visualização servidor (Sprint 3, Java Advanced).
Escopo isolado: depende do domínio; o domínio não depende dela.
Ver docs/ADR-web.md.

Formulário de cancelamento (SJ3-06) — motivo obrigatório
(AgendamentoService.cancelar, AgendamentoService.java:140), validado com
@NotBlank/@Size em CancelarAgendamentoForm e renderizado NO PRÓPRIO
formulário via BindingResult/th:errors (texto literal do §4 do brief da
SJ3-06 — nunca alerta genérico, nunca página de erro).
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <title>KURA — cancelar agendamento</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; color: #222; }
        label { display: block; margin-top: 0.75rem; }
        textarea { width: 100%; max-width: 30rem; padding: 0.3rem; }
        .erro { color: #b00020; }
        .info { color: #444; }
    </style>
</head>
<body>
<h1>Cancelar agendamento</h1>
<p class="info">
    Pet <strong th:text="${agendamento.nmPet}">Pet</strong> —
    <span th:text="${agendamento.dtAgendamento}">Data</span> —
    <span th:text="${agendamento.tipo}">Tipo</span>
</p>

<form th:action="@{/web/agendamentos/{id}/cancelar(id=${agendamento.idAgendamento})}"
      th:object="${cancelarForm}" method="post">
    <label>Motivo do cancelamento
        <textarea th:field="*{motivo}" rows="3"></textarea>
    </label>
    <p class="erro" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}">erro</p>

    <button type="submit">Confirmar cancelamento</button>
</form>

<p><a th:href="@{/web/agendamentos}">Voltar à lista</a></p>
</body>
</html>
