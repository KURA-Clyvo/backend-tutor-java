<!--
KURA-WEB — camada de visualização servidor (Sprint 3, Java Advanced).
Escopo isolado: depende do domínio; o domínio não depende dela.
Ver docs/ADR-web.md.

Painel pós-login — conteúdo condicional por perfil via sec:authorize
(thymeleaf-extras-springsecurity6, já declarado no pom.xml). Destino de
defaultSuccessUrl em WebSecurityConfig, para os dois perfis (TUTOR e
SUPORTE) — cada bloco só aparece para quem tem o papel correspondente.

Sem botão "voltar": esta é a raiz dos dois perfis. O "Sair" do cabeçalho
compartilhado é a única saída do painel (ver .logout() em WebSecurityConfig).
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="pt-br">
<head th:replace="~{web/fragments/layout :: cabeca('KURA — painel')}"></head>
<body>
<div class="pagina">
    <header th:replace="~{web/fragments/layout :: topo(null, null)}"></header>

    <h1>Painel</h1>
    <p class="info">Autenticado como <strong sec:authentication="name">usuário</strong>.</p>

    <section sec:authorize="hasRole('SUPORTE')" id="bloco-suporte">
        <h2>Suporte</h2>
        <p>Você está autenticado com o perfil de suporte.</p>
        <p><a class="botao-secundario" th:href="@{/web/suporte/contas}">Gerenciar contas</a></p>
    </section>

    <section sec:authorize="hasRole('TUTOR')" id="bloco-tutor">
        <h2>Tutor</h2>
        <p>Você está autenticado com o perfil de tutor.</p>
        <p><a class="botao-secundario" th:href="@{/web/agendamentos}">Meus agendamentos</a></p>
    </section>
</div>
</body>
</html>
