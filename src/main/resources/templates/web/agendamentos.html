<!--
KURA-WEB — camada de visualização servidor (Sprint 3, Java Advanced).
Escopo isolado: depende do domínio; o domínio não depende dela.
Ver docs/ADR-web.md.

Lista de agendamentos do TUTOR autenticado (SJ3-06) — fluxo não-CRUD: o que
separa isso de um CRUD é o lock otimista do remarcar (NR_VERSION -> 409 em
conflito, tratado nos @ExceptionHandler de WebAgendamentoController) e a
validação de motivo obrigatório no cancelar. Só TUTOR autenticado alcança
esta rota (o chain /web/** exige authenticated() para tudo fora de
/web/suporte/**); SUPORTE não precisa de acesso e não tem link daqui — ver
templates/web/painel.html.

A tabela vive dentro de .tabela-rolavel: em tela estreita ela rola dentro do
próprio contêiner, sem dar barra horizontal na página inteira.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{web/fragments/layout :: cabeca('KURA — meus agendamentos')}"></head>
<body>
<div class="pagina">
    <header th:replace="~{web/fragments/layout :: topo(@{/web/painel}, 'Voltar ao painel')}"></header>

    <h1>Meus agendamentos</h1>

    <p class="alerta mensagem" th:if="${mensagem}" th:text="${mensagem}">mensagem</p>

    <p class="vazio" th:if="${#lists.isEmpty(agendamentos)}">Nenhum agendamento encontrado.</p>

    <div class="tabela-rolavel" th:unless="${#lists.isEmpty(agendamentos)}">
        <table>
            <thead>
            <tr>
                <th>Pet</th>
                <th>Data</th>
                <th>Tipo</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="linha : ${agendamentos}" th:with="ag=${linha.ag}">
                <td th:text="${ag.nmPet}">Pet</td>
                <td th:text="${ag.dtAgendamento}">Data</td>
                <td th:text="${ag.tipo}">Tipo</td>
                <td th:text="${ag.status}">Status</td>
                <!-- As acoes so aparecem em agendamento ainda em curso. linha.acoesDisponiveis deriva
                     de StatusAgendamento.isFinal() no controller — nao ha lista de estados repetida
                     aqui de proposito. Ver WebAgendamentoController.Linha. -->
                <td class="acoes" th:if="${linha.acoesDisponiveis}">
                    <a th:href="@{/web/agendamentos/{id}/remarcar(id=${ag.idAgendamento})}">Remarcar</a>
                    <a th:href="@{/web/agendamentos/{id}/cancelar(id=${ag.idAgendamento})}">Cancelar</a>
                </td>
                <td class="acoes" th:unless="${linha.acoesDisponiveis}">
                    <span class="sem-acao">—</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
