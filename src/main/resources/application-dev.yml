# ==============================================================================
# KURA · Profile: dev
# Banco: H2 em memória (modo Oracle). Flyway cria o schema via migrations.
# Acesso H2 Console: http://localhost:8081/api/h2-console
# ==============================================================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:kuradb;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    # db/migration-h2 = equivalentes portáveis das migrations Oracle PL/SQL
    # (V2/V3/V5) — ver db/migration-oracle e docs/INT-01-contract-map.md.
    # Precisa ser SIBLING de db/migration (não subpasta): Flyway descarta
    # localizações que são sub-diretório de outra já incluída (scan recursivo),
    # o que faria as duas variantes colidirem com "Found more than one migration".
    locations: classpath:db/migration,classpath:db/migration-h2,classpath:db/callback
    baseline-on-migrate: true

management:
  endpoint:
    health:
      show-details: always

kura:
  jwt:
    # Fallback local — NÃO usar em produção. Mínimo 64 bytes em prod (exigência HS512).
    secret: ${JWT_SECRET:dev-secret-trocar-em-prod-com-no-minimo-64-bytes-gerado-localmente-aqui}

logging:
  level:
    br.com.clyvo.kura: DEBUG
    org.hibernate.SQL: DEBUG
    # Prints actual bound parameter values (e.g. the UUID token) — Hibernate 6.x (Boot 3.x)
    org.hibernate.orm.jdbc.bind: TRACE
    # Logs every request dispatch and handler resolution
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    # Logs which @ExceptionHandler is selected for each exception
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    org.flywaydb: INFO
