# ==============================================================================
# KURA · Profile: dev
# Banco: H2 em memória (modo Oracle). Flyway cria o schema via migrations.
# Acesso H2 Console: http://localhost:8081/api/h2-console
# ==============================================================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:kuradb;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/callback
    baseline-on-migrate: true

management:
  endpoint:
    health:
      show-details: always

kura:
  jwt:
    # Fallback local — NÃO usar em produção. Mínimo 64 bytes em prod (exigência HS512).
    secret: ${JWT_SECRET:dev-secret-trocar-em-prod-com-no-minimo-64-bytes-gerado-localmente-aqui}

logging:
  level:
    br.com.clyvo.kura: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
