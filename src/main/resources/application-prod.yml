# ==============================================================================
# KURA · Profile: prod
# Banco: Oracle 19c (oracle.fiap.com.br:1521/orcl — schema compartilhado .NET/Java).
# TODAS as variáveis abaixo são obrigatórias. Ausência causa falha na inicialização.
# ==============================================================================

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 20000        # ms antes de lançar exceção ao pedir conexão do pool
      maximum-pool-size: 5             # Oracle XE suporta poucas conexões simultâneas
      initialization-fail-timeout: 1   # falha rápido no startup se o DB não responder

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true   # schema compartilhado com .NET — trata estado atual como baseline
    baseline-version: "0"       # V0 = linha base; V1–V6 são aplicados se ainda não registrados
    out-of-order: false         # impede gaps acidentais na sequência de versões
    validate-on-migrate: true   # rejeita startup se checksum de migration aplicada divergir
    # db/migration-oracle = V2/V3/V5 originais (PL/SQL) — movidos de db/migration/
    # para permitir uma variante H2 portável em dev (sibling dir — ver nota em
    # application-dev.yml sobre Flyway descartar sub-locations aninhadas).
    # Conteúdo idêntico ao anterior; prod continua rodando o mesmo PL/SQL.
    locations: classpath:db/migration,classpath:db/migration-oracle

kura:
  jwt:
    # Sem fallback — ausência de JWT_SECRET causa startup failure intencional
    secret: ${JWT_SECRET}
    expiration-ms: 900000

logging:
  level:
    br.com.clyvo.kura: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
