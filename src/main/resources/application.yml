# ==============================================================================
# KURA · Backend Tutor · application.yml
# Configuração COMUM a todos os profiles.
# Profile default: dev (sem env SPRING_PROFILES_ACTIVE → sobe com H2).
# ==============================================================================

spring:
  application:
    name: kura-backend-tutor
  profiles:
    default: dev
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: caffeine
  web:
    resources:
      cache:
        cachecontrol:
          # Fotos da Loja (NX-04): nome de arquivo muda se a foto mudar, então cache longo é seguro.
          max-age: 7d
          cache-public: true
  data:
    mongodb:
      # KURA-LOJA. No compose, SPRING_DATA_MONGODB_URI (DevOps-Cloud) sobrescreve. O default
      # é só para dev/teste: o driver conecta de forma preguiçosa, sem Mongo nada quebra.
      # serverSelectionTimeoutMS curto: Mongo fora falha rápido em vez de pendurar 30 s.
      uri: mongodb://localhost:27017/kura_docs?serverSelectionTimeoutMS=2000

server:
  port: 8081
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mongo:
      # KURA-LOJA. Nome do Boot 3.2.5. Sem isto, Mongo fora derruba /actuator/health (503):
      # o kura-tutor ficaria unhealthy por causa de um banco que não é dele.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

kura:
  loja:
    # KURA-LOJA (Sprint 4). Desligados por padrão (dev/teste não tocam o Mongo); o compose liga.
    mongo:
      init-enabled: ${KURA_LOJA_MONGO_INIT_ENABLED:false}
    seed-exemplo:
      # EXCEÇÃO D-LOJA-10 à regra "dado fictício nunca em prod": só catalogo_loja, só exemplo=true.
      enabled: ${KURA_LOJA_SEED_EXEMPLO_ENABLED:false}
  cors:
    # Override em prod: CORS_ALLOWED_ORIGINS=https://app.clyvo.vet
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  jwt:
    # Expiration em ms — T11 irá introduzir conversão de JWT_ACCESS_EXPIRATION_MINUTES
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  auth:
    # SJ3-02: janela de bloqueio TEMPORÁRIO após MAX_TENTATIVAS_LOGIN (5) falhas
    # consecutivas — defesa anti-brute-force, não deve ser permanente. Passada
    # esta janela, o próximo login zera o contador e destranca a conta.
    janela-bloqueio-minutos: ${AUTH_JANELA_BLOQUEIO_MINUTOS:15}
  foto:
    # FT-05 (KURA_BACKLOG_FOTO_PET). Default vazio de propósito nos 3: GeradorUrlFotoPet
    # NÃO falha sem eles (decisão do maestro) — dsFotoUrl/dsFotoThumbUrl saem null e o app
    # usa a ilustração padrão; um único WARN é logado na partida. Segredo compartilhado
    # com o backend-clinica-dotnet via a MESMA variável de ambiente (FT-06) — precisa ter
    # ao menos 32 bytes UTF-8, senão é tratado como ausente.
    url-secret: ${FOTO_URL_SECRET:}
    # A origem HTTPS que os apps alcançam (a MESMA do Foto__UrlBase do .NET — achado F-P1 do G2 da
    # FT-04) — NUNCA o endereço interno do .NET. Sem fallback derivado de request (o
    # Java não é o host da foto, ao contrário do .NET).
    url-base: ${FOTO_URL_BASE:}
    url-validade-horas: ${FOTO_URL_VALIDADE_HORAS:24}
