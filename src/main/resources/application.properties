# =============================================================================
#  KURA · Backend Tutor · application.properties
#  Inspirado no padrão do projeto de aula (projeto-musica)
#  mas adaptado para o contexto KURA com H2 + Oracle
# =============================================================================

spring.application.name=kura-backend-tutor

# ── Datasource H2 (desenvolvimento sem Oracle) ───────────────────────────────
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:kuradb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=

# ── Console H2 ───────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8081
server.servlet.context-path=/api

# ── JWT ───────────────────────────────────────────────────────────────────────
kura.jwt.secret=CHAVE_SEGURA_MINIMO_256_BITS_TROCAR_EM_PRODUCAO_KURA2026
kura.jwt.expiration-ms=86400000

# ── Cache ─────────────────────────────────────────────────────────────────────
spring.cache.type=simple

# ── Swagger ───────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.br.com.clyvo.kura=DEBUG
logging.level.org.hibernate.SQL=DEBUG
