name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Perfil dev = H2 em memória (afterMigrate__seeds_dev.sql), sem Oracle externo.
      # Nenhum teste do repo usa Testcontainers hoje (a dependência oracle-xe está no
      # pom.xml para futuros testes de integração, mas nenhuma classe a importa —
      # confirmado via grep antes de escrever este workflow). Se/quando testes com
      # @Testcontainers forem adicionados, precisarão do serviço Docker do runner e
      # devem rodar em um job separado (perfil prod), sem afetar este job H2-only.
      - name: Test (dev/H2)
        run: ./mvnw -Dspring.profiles.active=dev test --batch-mode

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só valida que a imagem compila — sem push (sem credenciais de registry no CI).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kura-tutor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
