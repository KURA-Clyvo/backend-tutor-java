# =============================================================================
#  Profile: h2
#  Roda sem Docker, sem Oracle — ideal para desenvolver enquanto aguarda
#  o banco do Clayton/Gustavo subir.
#  Comando: mvn spring-boot:run -Dspring.profiles.active=h2
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:kuratutor;DB_CLOSE_DELAY=-1;MODE=Oracle;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console    # acesse em http://localhost:8081/api/h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # create-drop: recria as tabelas a cada restart com base nas entidades JPA
      # Quando migrar para Oracle, mude para "validate"
      ddl-auto: create-drop
    show-sql: true

  # Popula dados de exemplo no H2 ao iniciar
  sql:
    init:
      mode: always
      data-locations: classpath:data-h2.sql
