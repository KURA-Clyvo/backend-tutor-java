# =============================================================================
#  KURA · Backend Tutor · application.yml
#  Profile padrão: oracle
#  Para rodar sem Oracle: -Dspring.profiles.active=h2
# =============================================================================

spring:
  application:
    name: kura-backend-tutor

  profiles:
    active: oracle   # troque para "h2" se Oracle ainda não estiver no Docker

  # ── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    open-in-view: false           # evita lazy loading fora da transaction (boa prática)
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: KURA      # schema Oracle — ajuste se necessário

  # ── Cache (ConcurrentHashMap em memória — suficiente para o challenge) ──
  cache:
    type: simple

  # ── Serialização JSON ───────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    time-zone: America/Sao_Paulo

# ── Servidor ──────────────────────────────────────────────────────────────
server:
  port: 8081                       # 8080 costuma ser do Felipe (.NET); ajuste se precisar
  servlet:
    context-path: /api
  error:
    include-message: always        # mostra mensagens de erro no response (dev)
    include-binding-errors: always

# ── Segurança / JWT ───────────────────────────────────────────────────────
kura:
  jwt:
    secret: "TROQUE_POR_UMA_CHAVE_SEGURA_DE_256_BITS_EM_PRODUCAO"
    expiration-ms: 86400000        # 24h em milissegundos

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: "KURA — Backend Tutor"
    description: "API de identidade, consentimento e agendamento do tutor · Clyvo Vet"
    version: "1.0.0"

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    br.com.clyvo.kura: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # mostra parâmetros das queries
